include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # keep or remove any of these as you like
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    avoid_print: false

analyzer:
  exclude:
    - docs/**
    - "**/*.md"
    - "**/*.md.dart"
  errors:
    # treat these as warnings instead of errors in source
    deprecated_member_use: warning